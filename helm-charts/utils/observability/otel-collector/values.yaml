# Requires the OpenTelemetry Operator (utils/observability/otel-operator) — these are its
# custom resources, not plain workloads, so the CRDs must exist first.

# Namespace-wide collector: every service's telemetry ends up here.
collector:
  name: hermes
  mode: deployment
  # contrib, not the k8s distro: only contrib ships the prometheus exporter
  # that exposes the collected metrics for scraping.
  image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.156.0
  replicas: 1
  scrapeInterval: 30s
  # "basic" prints one summary line per batch; "detailed" prints every record.
  debugVerbosity: basic
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

# Where the collector ships what it gathers.
backends:
  mimir:
    enabled: true
    endpoint: https://mimir.internal.your-company.com/api/v1/push
    headers: {}
      # X-Scope-OrgID: "tenant-name"
    basicAuth:
      enabled: false
      username: ""
      password: ""
    tls:
      enabled: true
      secretName: mimir-tls-secret
      caFile: /etc/otel/certs/ca.crt
      certFile: /etc/otel/certs/tls.crt
      keyFile: /etc/otel/certs/tls.key
      insecure: false
      insecureSkipVerify: false

  loki:
    enabled: false
    endpoint: http://loki:3100/otlp

  tempo:
    enabled: false
    endpoint: tempo:4317

# Injected into pods annotated with sidecar.opentelemetry.io/inject: "true".
sidecar:
  name: hermes-sidecar
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
