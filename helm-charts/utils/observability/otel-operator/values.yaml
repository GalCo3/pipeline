opentelemetry-operator:
  fullnameOverride: otel-operator

  manager:
    collectorImage:
      repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-k8s
      tag: 0.156.0
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi

  admissionWebhooks:
    # No cert-manager in the local cluster, so Helm generates the webhook's
    # self-signed certificate instead.
    certManager:
      enabled: false
    autoGenerateCert:
      enabled: true
