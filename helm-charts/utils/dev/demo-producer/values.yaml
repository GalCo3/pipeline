fullnameOverride: demo-producer

image:
  registry: ""
  repository: demo-producer
  tag: local
  pullPolicy: IfNotPresent

service:
  enabled: false

# Runs to completion: one batch of demo documents, then exits.
restartPolicy: OnFailure
backoffLimit: 10
ttlSecondsAfterFinished: 600

# A suspended CronJob is always installed. It never fires on its own — it is
# the thing you trigger on demand: Headlamp → CronJobs → demo-producer →
# Trigger, or `kubectl -n hermes create job manual-1 --from=cronjob/demo-producer`.
cronJob:
  # 29 Feb on a non-leap-year schedule: never runs by itself, and the suspend
  # flag makes that explicit anyway.
  schedule: "0 0 29 2 *"
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1

# Also fire one batch as a Helm hook at install/upgrade time.
runOnInstall: true

env:
  BOOTSTRAP_SERVERS: kafka:9092
  TOPIC: cargo-lexical.files
  S3_ENDPOINT: http://minio:9000
  S3_BUCKET: cargo-lexical
  # >0 keeps the producer looping every N seconds instead of exiting.
  INTERVAL_SECONDS: "0"

secretEnv:
  S3_ACCESS_KEY: minioadmin
  S3_SECRET_KEY: minioadmin

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi

podSecurityContext: {}
containerSecurityContext: {}

imagePullSecrets: []
nodeSelector: {}
tolerations: []
affinity: {}
volumes: []
volumeMounts: []
podAnnotations: {}
