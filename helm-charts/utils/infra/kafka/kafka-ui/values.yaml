fullnameOverride: kafka-ui
replicaCount: 1

image:
  registry: docker.io
  repository: kafbat/kafka-ui
  tag: v1.3.0
  pullPolicy: IfNotPresent

service:
  enabled: true
  type: NodePort
  port: 8080
  targetPort: 8080
  # http://localhost:30080 on Docker Desktop.
  nodePort: 30080
  portName: http

env:
  KAFKA_CLUSTERS_0_NAME: local
  KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
  DYNAMIC_CONFIG_ENABLED: "true"
  AUTH_TYPE: DISABLED

readinessProbe:
  httpGet:
    path: /actuator/health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  failureThreshold: 10

livenessProbe:
  httpGet:
    path: /actuator/health
    port: http
  initialDelaySeconds: 90
  periodSeconds: 30

resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    memory: 1Gi

# The image declares a named user (kafkaui), which kubelet cannot verify as
# non-root, so the UID is stated explicitly here.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 100
  runAsGroup: 101
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext: {}

imagePullSecrets: []
nodeSelector: {}
tolerations: []
affinity: {}
volumes: []
volumeMounts: []
podAnnotations: {}
