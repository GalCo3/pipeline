fullnameOverride: demo-producer

image:
  registry: ""
  repository: demo-producer
  tag: local
  pullPolicy: IfNotPresent

service:
  enabled: false

# Runs to completion: one batch of demo documents, then exits.
restartPolicy: OnFailure
backoffLimit: 10
ttlSecondsAfterFinished: 600

# A suspended CronJob is always installed. It never fires on its own — it is
# the thing you trigger on demand: Headlamp → CronJobs → demo-producer →
# Trigger, or `kubectl -n hermes create job manual-1 --from=cronjob/demo-producer`.
cronJob:
  # 29 Feb on a non-leap-year schedule: never runs by itself, and the suspend
  # flag makes that explicit anyway.
  schedule: "0 0 29 2 *"
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1

# Also fire one batch as a Helm hook at install/upgrade time.
runOnInstall: true

env:
  BOOTSTRAP_SERVERS: kafka:9092
  # Which example fixtures (tools/demo-producer/examples/<name>.json) to produce.
  # Empty/unset means all of them. chief-lexical needs the chief-api mock
  # (local-infra/backing/chief-api) up, which install.sh deploys.
  # cargo-lexical retired: no chart consumes raw.cargo-lexical anymore, its
  # split successors cargo-operational-lexical and cargo-my-storage-lexical
  # are listed below instead.
  SOURCES: chat-messages-lexical,chat-rooms-lexical,chat-users-lexical,chief-lexical,candy-lexical,cargo-operational-lexical,cargo-my-storage-lexical
  # Each fixture carries its own topic; these override it per source.
  TOPIC_CHAT_MESSAGES_LEXICAL: raw.chat-messages
  TOPIC_CHAT_ROOMS_LEXICAL: raw.chat-rooms
  TOPIC_CHAT_USERS_LEXICAL: raw.chat-users
  TOPIC_CHIEF_LEXICAL: raw.chief
  TOPIC_CANDY_REPORTS_LEXICAL: raw.candy-reports
  TOPIC_CARGO_OPERATIONAL_LEXICAL: raw.cargo-operational
  TOPIC_CARGO_MY_STORAGE_LEXICAL: raw.cargo-my-storage
  S3_ENDPOINT: http://minio:9000
  S3_BUCKET: cargo-lexical
  # >0 keeps the producer looping every N seconds instead of exiting.
  INTERVAL_SECONDS: "0"

secretEnv:
  S3_ACCESS_KEY: minioadmin
  S3_SECRET_KEY: minioadmin

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi

podSecurityContext: {}
containerSecurityContext: {}

imagePullSecrets: []
nodeSelector: {}
tolerations: []
affinity: {}
volumes: []
volumeMounts: []
podAnnotations: {}
