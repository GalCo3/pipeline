# Requires the OpenTelemetry Operator (local-infra/observability/otel-operator) — these are its
# custom resources, not plain workloads, so the CRDs must exist first.

# Namespace-wide collector: every service's telemetry ends up here.
collector:
  name: hermes
  mode: deployment
  # contrib, not the k8s distro: only contrib ships the prometheus exporter
  # that exposes the collected metrics for scraping.
  image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.156.0
  replicas: 1
  scrapeInterval: 30s
  # "basic" prints one summary line per batch; "detailed" prints every record.
  debugVerbosity: basic
  # Measured at ~145Mi / ~9m for the whole namespace's telemetry.
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      memory: 1Gi

# Where the collector ships what it gathers. Swapping any of these endpoints
# for a Grafana Cloud URL (plus a `headers.authorization`) is all that stands
# between this stack and a hosted one.
backends:
  mimir:
    enabled: true
    endpoint: http://mimir:8080/api/v1/push
  loki:
    enabled: true
    endpoint: http://loki:3100/otlp
  tempo:
    enabled: true
    endpoint: tempo:4317

# Injected into pods annotated with sidecar.opentelemetry.io/inject: "true".
# The operator injects this as a native sidecar (an init container with
# restartPolicy: Always), so its requests count towards the pod's — and towards
# the node's, once per service. Measured at ~25Mi / ~0m each.
sidecar:
  name: hermes-sidecar
  resources:
    requests:
      cpu: 25m
      memory: 48Mi
    limits:
      memory: 256Mi
