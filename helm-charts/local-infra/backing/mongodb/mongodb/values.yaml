# Local-dev only: standalone node, root credentials in plaintext.
#
# The official image is used rather than a Bitnami wrapper because the
# bitnamilegacy MongoDB tags ship amd64 only, which excludes Apple Silicon.
fullnameOverride: mongodb
replicaCount: 1

image:
  registry: docker.io
  repository: mongo
  tag: "8.0"
  pullPolicy: IfNotPresent

service:
  enabled: true
  type: NodePort
  port: 27017
  targetPort: 27017
  nodePort: 30017
  portName: mongodb

env:
  MONGO_INITDB_DATABASE: hermes

secretEnv:
  MONGO_INITDB_ROOT_USERNAME: root
  MONGO_INITDB_ROOT_PASSWORD: mongoadmin

persistence:
  enabled: true
  size: 4Gi
  accessMode: ReadWriteOnce

# ReadWriteOnce implies Recreate: under a rolling update both pods land on the
# same node and mount the same volume, and the new mongod exits 100 because the
# old one still holds the data directory lock.
strategy:
  type: Recreate

volumes:
  - name: data
    persistentVolumeClaim:
      claimName: mongodb

volumeMounts:
  - name: data
    mountPath: /data/db

# `mongosh` starts a full JS shell before it can ping, which does not fit in the
# 1s timeoutSeconds defaults to — on a loaded node the probe times out, the
# kubelet kills a perfectly healthy mongod, and it restarts in a loop.
readinessProbe:
  exec:
    command:
      - mongosh
      - --quiet
      - --eval
      - "db.adminCommand('ping')"
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 10
  failureThreshold: 6

livenessProbe:
  exec:
    command:
      - mongosh
      - --quiet
      - --eval
      - "db.adminCommand('ping')"
  initialDelaySeconds: 60
  periodSeconds: 30
  timeoutSeconds: 10

# Measured at ~224Mi, so the memory request stays as-is — WiredTiger's cache
# grows to fill what it is given and this is already the floor it settles at.
resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    memory: 1Gi

# The official image ships the mongodb user as UID 999 and needs the data
# volume group-owned to match, hence the explicit fsGroup.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 999
  runAsGroup: 999
  fsGroup: 999
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext: {}

imagePullSecrets: []
nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
