# Local-dev only. Single node, security disabled, plain HTTP on port 9200.
elasticsearch:
  fullnameOverride: elasticsearch

  global:
    security:
      allowInsecureImages: true

  image:
    registry: docker.io
    repository: bitnamilegacy/elasticsearch
    tag: 9.1.2-debian-12-r0

  security:
    enabled: false

  # REST API on localhost:30920
  service:
    type: NodePort
    nodePorts:
      restAPI: "30920"

  # One node holding every role — master.masterOnly=false makes it a data node too.
  master:
    masterOnly: false
    replicaCount: 1
    persistence:
      enabled: true
      size: 4Gi
    # 384m heap for a dev node holding a handful of small indices. RSS runs at
    # roughly twice the heap here — the rest is Lucene's off-heap and the mmap'd
    # segments — so this is what sets the numbers below, not the other way round.
    heapSize: 384m
    # Was 1Gi/2Gi against a measured ~1123Mi. The single dev node only has ~8Gi
    # allocatable and this pod was the largest single claim on it, which is what
    # left reinstalls of other charts Pending on "Insufficient memory".
    resources:
      requests:
        cpu: 100m
        memory: 768Mi
      limits:
        memory: 1280Mi

  data:
    replicaCount: 0
  coordinating:
    replicaCount: 0
  ingest:
    enabled: false
    replicaCount: 0

  # Raises vm.max_map_count on the node. Works on Docker Desktop; drop this on
  # OpenShift, where the node-level sysctl is managed by a MachineConfig.
  sysctlImage:
    enabled: true
    registry: docker.io
    repository: bitnamilegacy/os-shell
    tag: 12-debian-12-r50

  volumePermissions:
    image:
      registry: docker.io
      repository: bitnamilegacy/os-shell
      tag: 12-debian-12-r50

  metrics:
    enabled: false
