# Local-dev only. No auth, talks plain HTTP to the in-cluster Elasticsearch.
kibana:
  fullnameOverride: kibana

  global:
    security:
      allowInsecureImages: true

  image:
    registry: docker.io
    repository: bitnamilegacy/kibana
    tag: 9.1.2-debian-12-r0

  # Point at the standalone elasticsearch release instead of the chart's
  # bundled subchart.
  elasticsearch:
    hosts:
      - elasticsearch
    port: 9200

  service:
    type: NodePort
    ports:
      http: 5601
    nodePorts:
      # http://localhost:30561 on Docker Desktop.
      http: 30561

  persistence:
    enabled: false

  # Do not cap the Node heap here. Kibana 9 allocates ~370MB before its plugins
  # finish installing their templates, so a `--max-old-space-size=384` kills it
  # mid-bootstrap with "Ineffective mark-compacts near heap limit" — the pod then
  # restart-loops with nothing obviously wrong in the chart.
  #
  # Was 768Mi/2Gi against a measured ~569Mi idle. Only the reservation comes
  # down; the limit stays well clear of the heap it actually wants.
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1280Mi

  volumePermissions:
    image:
      registry: docker.io
      repository: bitnamilegacy/os-shell
      tag: 12-debian-12-r50

  metrics:
    enabled: false
