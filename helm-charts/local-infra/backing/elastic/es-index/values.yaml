# Creates one index per service, each with its write alias. Idempotent: an existing
# index is left untouched, so a re-install never destroys data.
#
# One `configFiles` entry per physical index, named `<physical index>.json`. The
# command below derives the index name from the file name and lets Elasticsearch
# create the alias from the file's own `aliases` block, so adding a service means
# adding one entry here and nothing else.
#
# Field lists mirror the enriched model each service indexes:
#   candy-reports-lexical-reports  apps/services/candy-reports-lexical/models.py::CandyReportsMessage
#   cargo-lexical-files       apps/services/cargo-lexical/models.py::CargoEnrichedMessage
#   chat-lexical-messages     apps/services/chat-lexical/models.py::ChatEnrichedMessage
#   chat-rooms-lexical-rooms  apps/services/chat-rooms-lexical/models.py::ChatRoomMessage
#   chat-users-lexical-users  apps/services/chat-users-lexical/models.py::ChatUserMessage
#   chief-lexical             apps/services/chief-lexical/models.py::ChiefEnrichedMessage
# (each index is named `<logical name>-000001` and reached through a write alias
# of the logical name, which is what every service's INDEX_NAME points at.)
# `dynamic: strict` means a model field missing here fails the write, so keep them
# in step with the models.
fullnameOverride: es-index

image:
  registry: docker.io
  repository: curlimages/curl
  tag: 8.11.1
  pullPolicy: IfNotPresent

service:
  enabled: false

restartPolicy: OnFailure
backoffLimit: 5
ttlSecondsAfterFinished: 600

env:
  ELASTIC_URL: http://elasticsearch:9200

command:
  - /bin/sh
  - -c
  - |
    set -eu
    until curl -sf "$ELASTIC_URL/_cluster/health" >/dev/null; do
        echo "waiting for elasticsearch..."
        sleep 3
    done

    for file in /config/*.json; do
        index="$(basename "$file" .json)"

        if curl -sf -o /dev/null "$ELASTIC_URL/$index"; then
            echo "index $index already exists, nothing to do"
            continue
        fi

        echo "creating index $index"
        curl -sf -X PUT "$ELASTIC_URL/$index" \
            -H 'Content-Type: application/json' \
            --data-binary "@$file"
        echo
    done

    echo "all indices ready"

volumes:
  - name: config
    configMap:
      name: es-index

volumeMounts:
  - name: config
    mountPath: /config

# Shared by every index below: single-node dev cluster, so a replica would never
# be allocated and the index would sit yellow forever.
configFiles:
  candy-reports-lexical-reports-000001.json:
    aliases:
      candy-reports-lexical-reports:
        is_write_index: true
    settings:
      index:
        number_of_shards: 1
        number_of_replicas: 0
    mappings:
      dynamic: strict
      properties:
        # Stamped by every service at index/update time (hermes.utils.with_indexed_at).
        indexed_at:
          type: date
        id:
          type: keyword
        creatingUserName:
          type: keyword
        actualUserName:
          type: keyword
        description:
          type: text
        type:
          type: keyword
        date:
          type: date
        actualDate:
          type: date
        isDeleted:
          type: boolean
        updatingUser:
          type: keyword
        lastDeletionDate:
          type: date
        eventId:
          type: keyword
        deleteAuthor:
          type: keyword
        cellId:
          type: keyword
        realityId:
          type: keyword
        # The raw "frame/mclol/cell" string; the three segments are also split
        # out into their own fields by the model's `transform` validator.
        cellHierarchy:
          type: keyword
        creationDate:
          type: date
        lastUpdateTimeToTransfer:
          type: date
        frame:
          type: keyword
        mclol:
          type: keyword
        cell:
          type: keyword
        mirageAction:
          type: keyword
        militaryDistrictId:
          type: long

  cargo-lexical-files-000001.json:
    aliases:
      cargo-lexical-files:
        is_write_index: true
    settings:
      index:
        number_of_shards: 1
        number_of_replicas: 0
    mappings:
      dynamic: strict
      properties:
        # Stamped by every service at index/update time (hermes.utils.with_indexed_at).
        indexed_at:
          type: date
        id:
          type: keyword
        name:
          type: text
          fields:
            keyword:
              type: keyword
              ignore_above: 256
        holder:
          type: keyword
        description:
          type: text
        is_verified:
          type: boolean
        labels:
          type: nested
          properties:
            label_id:
              type: long
            label_name:
              type: keyword
            created:
              type: date
            group_id:
              type: long
            group_name:
              type: keyword
        path_id:
          type: keyword
        path:
          type: keyword
        # One term per path segment, so a folder subtree is a term query.
        path_list:
          type: keyword
        reality_id:
          type: keyword
        reality_type:
          type: keyword
        s3_key:
          type: keyword
        s3_bucket:
          type: keyword
        created:
          type: date
        last_modified:
          type: date
        ver_last_modified:
          type: date
        delete_date:
          type: date
        # The extracted document body: full-text searchable, never aggregated,
        # so no keyword subfield (documents blow past ignore_above anyway).
        text_content:
          type: text
        type:
          type: keyword

  chat-lexical-messages-000001.json:
    aliases:
      chat-lexical-messages:
        is_write_index: true
    settings:
      index:
        number_of_shards: 1
        number_of_replicas: 0
    mappings:
      dynamic: strict
      properties:
        # Stamped by every service at index/update time (hermes.utils.with_indexed_at).
        indexed_at:
          type: date
        id:
          type: keyword
        room_id:
          type: keyword
        msg:
          type: text
        sender:
          type: keyword
        created_at:
          type: date
        updated_at:
          type: date
        file:
          properties:
            id:
              type: keyword
            name:
              type: text
              fields:
                keyword:
                  type: keyword
                  ignore_above: 256
            type:
              type: keyword
        description:
          type: text
        user:
          properties:
            id:
              type: keyword
            username:
              type: keyword
            name:
              type: text
              fields:
                keyword:
                  type: keyword
                  ignore_above: 256
        mentions:
          type: nested
          properties:
            id:
              type: keyword
            username:
              type: keyword
            name:
              type: text
              fields:
                keyword:
                  type: keyword
                  ignore_above: 256
        channels:
          type: nested
          properties:
            id:
              type: keyword
            name:
              type: keyword
        # Rocket.Chat's system-message marker: its presence means "deleted".
        t:
          type: boolean
        url_strings:
          type: keyword
        room_type:
          type: keyword
        room_name:
          type: keyword
        users_count:
          type: long
        # The midurim a message belongs to: its room, or both parties of a DM.
        midur_ids:
          type: keyword

  chat-rooms-lexical-rooms-000001.json:
    aliases:
      chat-rooms-lexical-rooms:
        is_write_index: true
    settings:
      index:
        number_of_shards: 1
        number_of_replicas: 0
    mappings:
      dynamic: strict
      properties:
        # Stamped by every service at index/update time (hermes.utils.with_indexed_at).
        indexed_at:
          type: date
        id:
          type: keyword
        name:
          type: text
          fields:
            keyword:
              type: keyword
              ignore_above: 256
        room_type:
          type: keyword
        classification_level:
          type: long
        classification_color:
          type: keyword
        created_at:
          type: date
        updated_at:
          type: date
        description:
          type: text
        topic:
          type: text

  chat-users-lexical-users-000001.json:
    aliases:
      chat-users-lexical-users:
        is_write_index: true
    settings:
      index:
        number_of_shards: 1
        number_of_replicas: 0
    mappings:
      dynamic: strict
      properties:
        # Stamped by every service at index/update time (hermes.utils.with_indexed_at).
        indexed_at:
          type: date
        id:
          type: keyword
        created_at:
          type: date
        updated_at:
          type: date
        name:
          type: text
          fields:
            keyword:
              type: keyword
              ignore_above: 256
        email_address:
          type: keyword
        username:
          type: keyword
        roles:
          type: keyword
        hatzava_chail:
          type: keyword
        hatzava_pikud:
          type: keyword
        hatzava_yechida:
          type: keyword
        clean_name:
          type: text
          fields:
            keyword:
              type: keyword
              ignore_above: 256
        classification_level:
          type: long
        classification_color:
          type: keyword

  chief-lexical-000001.json:
    aliases:
      chief-lexical:
        is_write_index: true
    settings:
      index:
        number_of_shards: 1
        number_of_replicas: 0
    mappings:
      dynamic: strict
      properties:
        # Stamped by every service at index/update time (hermes.utils.with_indexed_at).
        indexed_at:
          type: date
        id:
          type: keyword
        type:
          type: keyword
        template_id:
          type: keyword
        reference_id:
          type: keyword
        name:
          type: text
          fields:
            keyword:
              type: keyword
              ignore_above: 256
        create_date:
          type: date
        last_update_date:
          type: date
        stage:
          type: keyword
        description:
          type: text
        mifkada:
          type: keyword
        version:
          type: long
        classification:
          type: keyword
        validity_start_date:
          type: date
        content_last_update_date:
          type: date
        validity_end_date:
          type: date
        reality_id:
          type: long
        michlol_id:
          type: keyword
        attachments_description:
          type: text
        doc_num:
          type: long
        distribution_date:
          type: date
        metro_last_update_date:
          type: date
        last_distribution_date:
          type: date
        type_display_name:
          type: keyword
        is_deleted:
          type: boolean
        mailing_list:
          type: keyword
        directories:
          type: keyword
        operational_directory:
          type: keyword
        command_content:
          type: nested
          properties:
            id:
              type: keyword
            name:
              type: text
              fields:
                keyword:
                  type: keyword
                  ignore_above: 256
            full_name:
              type: text
              fields:
                keyword:
                  type: keyword
                  ignore_above: 256
            order:
              type: long
            user_id:
              type: keyword
            # ChiefCommandContent keeps a date it could not parse as the raw
            # string, so an unparseable value must not fail the whole write.
            create_date:
              type: date
              ignore_malformed: true
            last_update_date:
              type: date
              ignore_malformed: true
            note:
              type: text
            text:
              type: text
        # The command body, HTML stripped.
        cleaned_text:
          type: text

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

# curlimages/curl declares a named user (curl_user), which kubelet cannot
# verify as non-root, so the UID is stated explicitly.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 100
  runAsGroup: 101
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext: {}

imagePullSecrets: []
nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
