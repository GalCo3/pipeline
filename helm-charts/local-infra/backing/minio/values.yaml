# Local-dev only. Standalone MinIO with the cargo-lexical and tokenizers
# buckets pre-created.
minio:
  fullnameOverride: minio
  mode: standalone

  global:
    security:
      allowInsecureImages: true

  image:
    registry: docker.io
    repository: bitnamilegacy/minio
    tag: 2025.7.23-debian-12-r3

  clientImage:
    registry: docker.io
    repository: bitnamilegacy/minio-client
    tag: 2025.7.21-debian-12-r2

  # S3 API on localhost:30900
  service:
    type: NodePort
    nodePorts:
      api: "30900"

  console:
    enabled: true
    # Web console on localhost:30901
    service:
      type: NodePort
      nodePorts:
        http: "30901"
    image:
      registry: docker.io
      repository: bitnamilegacy/minio-object-browser
      tag: 2.0.2-debian-12-r3
    # Without this the chart falls back to its "nano" resourcesPreset, which
    # reserves 128Mi/100m for a browser UI measured at ~20Mi / ~0m.
    resources:
      requests:
        cpu: 25m
        memory: 48Mi
      limits:
        memory: 256Mi

  auth:
    rootUser: minioadmin
    rootPassword: minioadmin

  # `tokenizers` holds one flat prefix per HuggingFace tokenizer, which is what
  # hermes.utils.triton.init_tokenizer downloads from; fill it with
  # tools/scripts/tokenizers/upload_tokenizer.py.
  defaultBuckets: cargo-lexical,tokenizers

  persistence:
    enabled: true
    size: 2Gi

  # Measured at ~81Mi / ~2m holding the cargo sample objects.
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 1Gi
