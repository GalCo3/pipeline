[project]
name = "connections"
version = "1.3.1"
requires-python = ">=3.14"

dependencies = [
    "boto3>=1.43.46",
    "boto3-stubs~=1.43.46",
    "confluent-kafka[schemaregistry]>=2.8.2",
    "fastavro>=1.12.2",
    "jsonschema>=4.26.0",
    "elasticsearch==8.19.2",
    "jsonpickle>=4.1.2",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.7.0",
    "pymongo>=4.17.0",
    "tenacity>=9.1.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes"]
