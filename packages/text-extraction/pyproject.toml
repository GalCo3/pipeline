[project]
name = "text-extraction"
version = "1.0.0"
requires-python = ">=3.14"

dependencies = [
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-docx>=1.2.0",
    "pypdfium2>=5.12.1",
    "openpyxl>=3.1.5",
    "requests>=2.34.2",
    "filetype>=1.2.0",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=4.1.0",
    "responses>=0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes"]
