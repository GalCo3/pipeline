[project]
name = "semantic-enrichment"
version = "1.0.0"
requires-python = ">=3.14"

dependencies = [
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "numpy>=2.1",
    "tritonclient[http]>=2.51",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes"]
