[project]
name = "utils"
version = "1.0.0"
requires-python = ">=3.14"

dependencies = [
    "pydantic>=2.13.4",
    "confluent-kafka[schemaregistry]>=2.8.2",
    "python-dateutil>=2.9",
    "connections",
    "observability",
    "numpy>=1.26.0",
    "transformers>=4.46.0",
]

[tool.uv.sources]
connections = { workspace = true }
observability = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes"]
