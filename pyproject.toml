[project]
name = "pipeline"
version = "1.0.0"
requires-python = ">=3.14"

dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.16.1",
    "ty>=0.0.65",
]

[tool.uv.workspace]
members = ["libs/*", "apps/services/*", "apps/jobs/*"]
# dls-portal is Node end to end, so it has no manifest for the glob above to
# find and every uv command would fail on the missing manifest.
exclude = ["apps/services/dls-portal"]

[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py314"

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # pyflakes
    "I", # isort
    "UP", # pyupgrade
    "B", # flake8-bugbear
    "C4", # flake8-comprehensions
    "SIM", # flake8-simplify
    "RET", # flake8-return
    "PTH", # flake8-use-pathlib
    "RUF", # ruff-specific rules
]

[tool.ruff.lint.isort]
known-first-party = ["hermes"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["libs/*", "apps/services/*", "apps/jobs/*"]
